[project]
name = "camel-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-experimental>=0.4.2",
    "langchain-milvus>=0.4.0",
    "langchain-openai>=1.6.2",
    "langchain-text-splitters>=1.1.2",
    "minio>=7.2.20",
    "pypdf>=6.19.0",
    "camel-ai>=0.2.90",
    "requests>=2.34.2",
]

[project.scripts]
camel-agent = "camel_agent:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
